name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.4']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sanad
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sanad -d sanad"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, intl, bcmath, pdo, pdo_pgsql, pgsql, redis, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Check PHP code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Build front-end assets
        run: npm run build

      - name: Run database migrations (PostgreSQL)
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sanad
          DB_USERNAME: sanad
          DB_PASSWORD: secret

      - name: Run tests (Pest)
        run: php artisan test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  # Runs the WHOLE suite against a real PostgreSQL 16 (the production engine).
  # The job above stays on SQLite for speed; this one exercises pgsql-specific
  # behaviour — atomic ON CONFLICT upserts, transactional DDL in the migration
  # test, and the genuine multi-process concurrency tests, which are skipped on
  # SQLite. phpunit.xml pins DB_CONNECTION=sqlite WITHOUT force="true", so the
  # job's DB_* environment variables take precedence.
  tests-postgresql:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sanad
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sanad -d sanad"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sanad
      DB_USERNAME: sanad
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, intl, bcmath, pdo, pdo_pgsql, pgsql, redis, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Build front-end assets
        run: npm run build

      - name: Run database migrations (PostgreSQL)
        run: php artisan migrate --force

      - name: Run full test suite on PostgreSQL
        run: php artisan test

      # Guard: the real concurrency tests must EXECUTE here, never be skipped.
      - name: PostgreSQL concurrency tests must run (not skipped)
        run: |
          set -o pipefail
          php artisan test tests/Feature/Billing/PostgresConcurrencyTest.php tests/Feature/Payments/PostgresPaymentConcurrencyTest.php tests/Feature/Reconciliation/PostgresReconciliationConcurrencyTest.php tests/Feature/Fx/PostgresFxConcurrencyTest.php tests/Feature/Close/PostgresCloseConcurrencyTest.php tests/Feature/Payments/PostgresPaymentDoubleSubmitTest.php tests/Feature/Payments/PostgresAllocationIdempotencyTest.php tests/Feature/Reconciliation/PostgresReconciliationDoubleSubmitTest.php 2>&1 | tee pg-concurrency.log
          if grep -qiE "skipped|no tests executed" pg-concurrency.log; then
            echo "::error::A PostgreSQL concurrency test was skipped — the job is not running on PostgreSQL."
            exit 1
          fi
